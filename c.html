<!DOCTYPE html>
<html lang="en">
	<script>
		var f = document.location.search.replace("?", "");
		/* Copied from https://blog.csdn.net/milimu/article/details/135506336 */
		function ct(msg) {
			document.getElementById("t").innerText = msg;
		}
		fetch(
			"https://gitee.com/api/v5/repos/zyc-2024/website/raw/" +
				f +
				"?access_token=19f7b43872c256d52d1bc71cbd2d0ffa"
		)
			.then((response) => {
				if (response.status === 200) {
					const reader = response.body.getReader();
					const contentLength =
						+response.headers.get("Content-Length");
					let receivedLength = 0;
					let chunks = [];
					return reader
						.read()
						.then(function processChunk({ done, value }) {
							if (done) {
								ct("下载完成");
								let data = new Uint8Array(receivedLength);
								let position = 0;
								for (let chunk of chunks) {
									data.set(chunk, position);
									position += chunk.length;
								}
								return new Blob([data]);
							}
							chunks.push(value);
							receivedLength += value.length;
							ct(
								`已下载：${receivedLength}，总大小：${contentLength}`
							);
							return reader.read().then(processChunk);
						});
				} else {
					ct("下载失败");
				}
			})
			.then((blob) => {
				const blobUrl = window.URL.createObjectURL(blob);
				const aEl = document.createElement("a");
				aEl.href = blobUrl;
				aEl.download = f;
				aEl.click();
				window.URL.revokeObjectURL(blobUrl);
				ct("下载成功");
			})
			.finally(() => {});
	</script>
	<head>
		<h1
			id="t"
			style="text-align: center">
			下载中，请耐心等待。
		</h1>
	</head>
</html>
