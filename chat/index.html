					<script>
						
						function dset(key, val) {
							localStorage.setItem(key, val);
						}

						function dget(key) {
							var data = localStorage.getItem(key);
							var dataObj = JSON.parse(data);
							return data;
						}

						function getname() {
							if (document.cookie == "") {
								document.cookie = "n=" + prompt("请输入你的名字") + ";path=/;expires=Fri, 31 Dec 9999 23:59:59 GMT;max-age=9223372036854775807";
							}
							return document.cookie.split("=")[1].split(";")[0];
						}

						var eee;
						function gettime(time = +new Date()) {
							var date = new Date(time + 8 * 3600 * 1000);
							return date.toJSON().substr(0, 19).replace("T", " ").replaceAll("-", "");
						}

						function cname() {
							let a;
							document.cookie = a = prompt("请输入你的新名字");
							document.getElementById("nname").innerText = "现在的用户名：" + a;
							localStorage.setItem("n", a);
							namee = a;
						}

						function getch() {
							let c = window.location.search.substring(1);
							return c == "" ? "main" : c;
						}
						let namee = (name0 = "Anonymous");
						if (document.location.protocol == "file:") {
							namee = name0 = prompt("请输入你的名字");
						} else {
							namee = name0 = getname();
						}
						var ch = getch();

						function upload() {
							document.getElementById("button").disabled = true;
							setTimeout(function () {
								document.getElementById("button").disabled = false;
							}, 5000);
							if (document.getElementsByClassName("mp-preview-content")[0].innerText === "") {
								alert("内容不能为空！");
								return;
							}
							let c =
								$(".mp-preview-content")[0]
									?.innerHTML.replaceAll(">\n<", "><")
									.replaceAll("\n", "<br>")
									.replaceAll(/ data-line="[0-9]+"/g, "") || "";
							var sha;
							$.ajax({
								url: "https://gitee.com/api/v5/repos/zyc-2024/chat/raw/" + ch + ".json",
								crossDomain: true,
								contentType: "application/json;charset=UTF-8",
								data: {
									access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
								},
							}).done(function (response) {
								r = JSON.parse(response);
								r.msg[r.msg.length] = {
									name: namee,
									time: gettime(),
									content: c,
								};
								$.get("https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" + ch + ".json", {
									access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
								}).done(function (response) {
									eee = response.sha;
									sha = response.sha;
									var t = new Date();
									$.ajax({
										url: "https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" + ch + ".json",
										crossDomain: true,
										method: "PUT",
										contentType: "application/json;charset=UTF-8",
										data: JSON.stringify({
											access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
											content: Base64.encode(JSON.stringify(r)),
											sha: sha,
											message: namee + " @ " + t.getTime(),
										}),
									}).done(function (response) {
										location.reload();
										reload();
									});
								});
							});
							document.getElementsByClassName("content").innerText = "";
						}
						var rrrr;
						function reload() {
							var content;
							$.ajax({
								url: "https://gitee.com/api/v5/repos/zyc-2024/chat/raw/" + ch + ".json",
								crossDomain: true,
								contentType: "application/json;charset=UTF-8",
								data: {
									access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
								},
							}).done(function (response) {
								content = rrrr = JSON.parse(response);
								document.getElementById("chat").innerHTML = "";
								if (content.msg) {
									var msg = content.msg;
								} else {
									console.error("response 中没有 msg 属性");
									var msg = [];
								}
								// document.getElementById("chat").innerHTML +=
								// 	"<table><tr><th>用户名</th><th>时间</th><th>内容</th></tr>";
								for (let i in msg) {
									document.getElementById("chat").innerHTML += "<br><div class='cr'><span><div class='cn'>" + msg[i].name + "</div><div class='ct'>" + msg[i].time + "</div></span><div class='cc'><p>" + msg[i].content + "</p></div></div>";
								}
								// document.getElementById("chat").innerHTML += "</table>";
								
							});
						}
						setTimeout(reload(), 200);
						$.ajax({
							url: "https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" + ch + ".json",
							crossDomain: true,
							data: {
								access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
							},
							contentType: "application/json;charset=UTF-8",
						}).done(function (response) {
							window.scroll({
									top: document.body.scrollHeight,
									behavior: "smooth",
								});
							let cnt = Base64.encode(
								JSON.stringify({
									msg: [
										{
											name: namee,
											time: new Date().toISOString().replace("T", " ").replace("Z", "").split(".")[0].replaceAll("-", ""),
											content: "created " + ch,
										},
									],
								})
							);
							console.log("create");
							$.ajax({
								url: "https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" + ch + ".json",
								crossDomain: true,
								method: "post",
								contentType: "application/json;charset=UTF-8",
								data: JSON.stringify({
									content: cnt,
									access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
									message: namee + " created " + ch,
								}),
							}).done(function (response) {
								reload();
							});
						});
						//chatkey 19f7b43872c256d52d1bc71cbd2d0ffa

	url: 'https://gitee.com/api/v5/repos/zyc-2024/chat/contents/xxx.json',

		'content': 'xxx',
		'message': 'xxx'

}).done(function(response) {
	console.log(response);

	contentType: 'application/json;charset=UTF-8'
}).done(function(response) {
	console.log(response);
});*/
						function cch(event, m = 0) {
							if (event == "") {
							} else {
								event.preventDefault();
							}
							let v = m ? "" : document.getElementById("ch").value;
							document.location.href = document.location.href.split("?")[0] + "?" + v;
						}function tick() {
							reload();
							setTimeout(tick, 1000);
						}tick();
					</script>

					<script>

					<br />
					<button id="button" onclick="javascript:getch()=='main'||getch()=='changelog'?alert('不能在这些频道里发消息awa，换个频道吧'):upload()">发送</button>
					<button onclick="javascript:reload()">刷新</button>
					<button onclick="javascript:cname()">改名</button>
					<button onclick="javascript:cch(0,1)">回到主页</button>
					<form onsubmit="cch(event)"><input id="ch" placeholder="输入你想去的频道" /><button onclick="javascript:document.location.href=document.location.href.split('?')[0]+'?'+document.getElementById('ch').value;">go!</button></form>
					<div id="nname"></div>
					<script>
						document.getElementById("nname").innerText = "现在的用户名：" + namee;
