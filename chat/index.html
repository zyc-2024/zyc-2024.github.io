		<script>
			function dset(key,val){

}
function dget(key){

			// 		}

			// 	}
			var eee;
			let name0 =localStorage.getItem("n");
			var namee = name0 == "" ? prompt("请输入你的名字") : name0;
			function gettime(time = +new Date()) {
				var date = new Date(time + 8 * 3600 * 1000);
				return date
					.toJSON()
					.substr(0, 19)
					.replace("T", " ")
					.replaceAll("-", "");
			}
			function cname() {
				let a;
				document.cookie = a = prompt("请输入你的新名字");
				document.getElementById("nname").innerText =
					"现在的用户名：" + a;
					localStorage.setItem("n",a);
					// document.cookie="n="+a+";path=/;expires=Fri, 31 Dec 9999 23:59:59 GMT;max-age=2147483647";
				namee=a;
			}
			function getch() {
				let c = window.location.search.substring(1);
				return c == "" ? "main" : c;
			}
			var ch = getch();
			function upload() {
				var sha;
				document.getElementById("button").disabled = true;
				setTimeout(function () {
					document.getElementById("button").disabled = false;
				}, 5000);
				$.ajax({
					url:
						"https://gitee.com/api/v5/repos/zyc-2024/chat/raw/" +
						ch +
						".json",
					crossDomain: true,
					contentType: "application/json;charset=UTF-8",
					data: {
						access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
					},
				}).done(function (response) {
					r = JSON.parse(response);
					r.msg[r.msg.length] = {
						name: namee,
						time: gettime(),
						content: $(".content")[0].value,
					};
					$.get(
						"https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" +
							ch +
							".json",
						{
							access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
						}
					).done(function (response) {
						eee = response.sha;
						sha = response.sha;
						var t = new Date();
						$.ajax({
							url:
								"https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" +
								ch +
								".json",
							crossDomain: true,
							method: "PUT",
							contentType: "application/json;charset=UTF-8",
							data: JSON.stringify({
								access_token:
									"19f7b43872c256d52d1bc71cbd2d0ffa",
								content: Base64.encode(JSON.stringify(r)),
								sha: sha,
								message: namee + " @ " + t.getTime(),
							}),
						}).done(function (response) {
							reload();
						});
					});
				});
			}
			var rrrr;
			function reload() {
				var content;
				$.ajax({
					url:
						"https://gitee.com/api/v5/repos/zyc-2024/chat/raw/" +
						ch +
						".json",
					crossDomain: true,
					contentType: "application/json;charset=UTF-8",
					data: {
						access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
					},
				}).done(function (response) {
					content = rrrr = JSON.parse(response);
					document.getElementById("chat").innerHTML = "";
					if (content.msg) {
						var msg = content.msg;
					} else {
						console.error("response 中没有 msg 属性");
						var msg = [];
					}
					for (let i in msg) {
						document.getElementById("chat").innerHTML +=
							"<tr><td>" +
							msg[i].name +
							"</td><td>" +
							msg[i].time +
							"</td><td>" +
							msg[i].content +
							"</td></tr>";
					}
				});
			}
			setTimeout(reload(), 200);
			$.ajax({
				url:
					"https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" +
					ch +
					".json",
				crossDomain: true,
				data: {
					access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
				},
				contentType: "application/json;charset=UTF-8",
			}).done(function (response) {
				let cnt = Base64.encode(
					JSON.stringify({
						msg: [
							{
								name: namee,
								time: new Date()
									.toISOString()
									.replace("T", " ")
									.replace("Z", "")
									.split(".")[0]
									.replaceAll("-", ""),
								content: "created " + ch,
							},
						],
					})
				);
				console.log("create");
				$.ajax({
					url:
						"https://gitee.com/api/v5/repos/zyc-2024/chat/contents/" +
						ch +
						".json",
					crossDomain: true,
					method: "post",
					contentType: "application/json;charset=UTF-8",
					data: JSON.stringify({
						content: cnt,
						access_token: "19f7b43872c256d52d1bc71cbd2d0ffa",
						message: namee + " created " + ch,
					}),
				}).done(function (response) {
					reload();
				});
			});

		</script>

	<body>
		<table>
			<thead>
				<tr>
					<th>name</th>
					<th>time</th>
					<th>content</th>
				</tr>
			</thead>
			<tbody id="chat"></tbody>
		</table>
		<textarea
			class="content"
			placeholder="content"
			required
			style="height: 65px; width: 337px"
		></textarea>
		<br />
		<button id="button" onclick="upload()">发送</button>
		<button onclick="reload()">刷新</button>
		<button onclick="cname()">改名</button>
		<div id="nname"></div>
		<script>
			document.getElementById("nname").innerText =
