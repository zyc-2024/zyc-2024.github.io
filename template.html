<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        header {
            background: #222;
            color: #fff;
            padding: 2rem 0;
            text-align: center;
        }
        nav {
            margin: 1rem 0;
            text-align: center;
        }
        nav a {
            color: #222;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
        }
        nav a:hover {
            color: #0078d7;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .info-box {
            background: #f1f7ff;
            border-left: 4px solid #0078d7;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-radius: 6px;
        }
        .info-title {
            font-size: 1.3rem;
            color: #0078d7;
            margin-bottom: 0.5rem;
        }
        .info-content {
            color: #333;
            font-size: 1rem;
        }
        footer {
            text-align: center;
            color: #aaa;
            padding: 2rem 0 1rem 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>新页面标题</h1>
    </header>
    <main>
        <div class="info-box">
            <div class="info-title">Template</div>
            <div class="info-content">
                Info<br>
                Content
            </div>
        </div>
        <nav>
            <a href="/">返回博客主页</a>
        </nav>
    </main>
    <footer>
        &copy; zyc2024, 2025. Powered by GitHub Pages and Github Copilot.
    </footer>
</body>
</html>
